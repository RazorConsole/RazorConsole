name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-format:
    name: Verify formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore RazorConsole.slnx

      - name: Check formatting
        run: dotnet format RazorConsole.slnx --verify-no-changes

  build-test:
    name: Build and test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore RazorConsole.slnx

      - name: Build
        run: dotnet build RazorConsole.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build -- --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml

      - name: Terminal wheel regression (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/razorconsole-pty"
          "$RUNNER_TEMP/razorconsole-pty/bin/pip" install pyte==0.8.2
          "$RUNNER_TEMP/razorconsole-pty/bin/python" tests/e2e/gallery-scroll-pty.py --dotnet "$(command -v dotnet)" --framework net11.0

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics-${{ matrix.os }}
          path: artifacts/bin/RazorConsole.Tests/**/TestResults/*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          files: ${{ github.workspace }}/**/coverage.cobertura.xml
          fail_ci_if_error: false
          flags: unittests
          name: codecov-${{ matrix.os }}
        continue-on-error: true

      - name: Upload RazorConsole.Core build output
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: razorconsole-core-release_net10.0
          path: artifacts/bin/RazorConsole.Core/release_net10.0
          if-no-files-found: error

  native-aot-version:
    name: Compute Native AOT version
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - name: Compute artifact version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            head_sha="${{ github.event.pull_request.head.sha }}"
            version="pr-${{ github.event.pull_request.number }}-${head_sha:0:7}"
          else
            version="nightly-$(date -u +'%Y%m%d-%H%M%S')-${GITHUB_SHA:0:7}"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

  native-aot:
    name: Native AOT apps (${{ matrix.rid }})
    needs: native-aot-version
    strategy:
      fail-fast: false
      matrix:
        include:
          # Match the release matrix so every distributable is validated before merge.
          - os: ubuntu-22.04
            rid: linux-x64
            artifact: linux-x64
            archive: tar.gz
          - os: ubuntu-22.04-arm
            rid: linux-arm64
            artifact: linux-arm64
            archive: tar.gz
          - os: windows-2025
            rid: win-x64
            artifact: windows-x64
            archive: zip
          - os: windows-11-vs2026-arm
            rid: win-arm64
            artifact: windows-arm64
            archive: zip
          - os: macos-15-intel
            rid: osx-x64
            artifact: macos-x64
            archive: tar.gz
          - os: macos-15
            rid: osx-arm64
            artifact: macos-arm64
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x

      - name: Install Linux Native AOT prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Publish and package Native AOT apps
        shell: pwsh
        run: |
          ./scripts/publish-native-aot-apps.ps1 `
            -RuntimeIdentifier "${{ matrix.rid }}" `
            -Version "${{ needs.native-aot-version.outputs.value }}" `
            -ManifestPath artifacts/native-aot-apps.json

      - name: Verify native executable architectures
        shell: bash
        run: |
          while IFS=$'\t' read -r command assembly; do
            assembly="${assembly%$'\r'}"
            executable="artifacts/native-aot/$command/publish/$assembly"
            if [[ "$RUNNER_OS" == "Windows" ]]; then
              executable="$executable.exe"
            fi
            description="$(file "$executable")"
            echo "$description"
            if [[ "${{ matrix.rid }}" == *-arm64 ]]; then
              echo "$description" | grep -Eiq 'arm64|aarch64'
            else
              echo "$description" | grep -Eiq 'x86-64|x86_64|x64'
            fi
          done < <(jq -r '.apps[] | [.commandName, .assemblyName] | @tsv' artifacts/native-aot-apps.json)

      - name: Upload Native AOT archives
        uses: actions/upload-artifact@v4
        with:
          name: native-aot-${{ matrix.artifact }}
          path: artifacts/native-aot/*.${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 7

  publish-gallery-nightly:
    name: Publish Native AOT nightly
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - validate-format
      - build-test
      - website-build
      - native-aot-version
      - native-aot
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Native AOT archives
        uses: actions/download-artifact@v4
        with:
          pattern: native-aot-*
          path: artifacts/release
          merge-multiple: true

      - name: Validate archives and generate checksums
        working-directory: artifacts/release
        shell: bash
        run: |
          expected=(
            linux-x64.tar.gz
            linux-arm64.tar.gz
            windows-x64.zip
            windows-arm64.zip
            macos-x64.tar.gz
            macos-arm64.tar.gz
          )
          version="${{ needs.native-aot-version.outputs.value }}"
          apps=()
          for archive in *-"$version"-linux-x64.tar.gz; do
            apps+=("${archive%-$version-linux-x64.tar.gz}")
          done
          test "${#apps[@]}" -gt 0
          for app in "${apps[@]}"; do
            for suffix in "${expected[@]}"; do
              test -f "$app-$version-$suffix"
            done
          done
          sha256sum ./*.tar.gz ./*.zip > checksums-sha256.txt
          test "$(wc -l < checksums-sha256.txt)" -eq "$((${#apps[@]} * ${#expected[@]}))"

      - name: Prepare nightly release notes
        shell: bash
        run: |
          cat > nightly-notes.md <<EOF
          Automated RazorConsole official application Native AOT build from \`main\`.

          Commit: \`${GITHUB_SHA}\`
          Built: $(date -u +'%Y-%m-%d %H:%M:%S UTC')

          This is an unstable development build. Use the stable release unless you want to test the latest changes.
          EOF

      - name: Publish immutable-ready nightly prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NIGHTLY_TAG: ${{ needs.native-aot-version.outputs.value }}
        shell: bash
        run: |
          gh release create "$NIGHTLY_TAG" \
            artifacts/release/*.tar.gz \
            artifacts/release/*.zip \
            artifacts/release/checksums-sha256.txt \
            --target "$GITHUB_SHA" \
            --title "RazorConsole Native AOT $NIGHTLY_TAG" \
            --notes-file nightly-notes.md \
            --draft \
            --prerelease \
            --latest=false

          gh release edit "$NIGHTLY_TAG" --draft=false

  website-build:
    name: Build website
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Download RazorConsole.Core build output
        uses: actions/download-artifact@v4
        with:
          name: razorconsole-core-release_net10.0
          path: artifacts/bin/RazorConsole.Core/release_net10.0

      - name: Setup .NET for documentation and WASM
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: website

      - name: Build website for preview
        # Terminal transport checks run independently of the documentation build.
        run: npm run test:terminal-input && npm run build
        env:
          VITE_ROUTER_BASENAME: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && format('/{0}/', github.event.repository.name) || '/' }}
          VITE_BASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && format('/{0}/', github.event.repository.name) || '/' }}
          VITE_SITE_URL: >-
            ${{ 
              github.event_name == 'push' && github.ref == 'refs/heads/main' 
              && format('https://{0}.github.io', github.repository_owner) 
              || format('https://pr-{0}.razorconsole.pages.dev', github.event.pull_request.number) 
            }}
        working-directory: website

      - name: Prepare artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          # Move all prerendered pages to build/client
          cp -r website/build/client/${{ github.event.repository.name }}/* website/build/client/ || true
          
          # Create 404 page 
          cp website/build/client/index.html website/build/client/404.html
          
          rm -rf website/build/client/${{ github.event.repository.name }}
          
          touch website/build/client/.nojekyll

      - name: Upload preview artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: website-preview-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: website/build/client
          retention-days: 30

      - name: Configure Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/build/client

  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: website-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  publish-nightly:
    name: Publish nightly build
    runs-on: ubuntu-latest
    needs: [validate-format, build-test, website-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 2

      - name: Check for source code changes
        id: check-changes
        run: |
          # Get the list of changed files in the last commit
          # Handle edge case where there might be no parent commit
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git ls-tree --name-only -r HEAD)

          # Check if any source code files were changed
          # Source code includes:
          # - .cs, .razor, .csproj, .props, .targets files
          # - src/ directory
          # - CI/CD workflows that affect package building
          if echo "$CHANGED_FILES" | grep -qE '\.(cs|razor|csproj|props|targets)$|^src/|^\.github/workflows/(ci|release)\.yml'; then
            echo "source_changed=true" >> "$GITHUB_OUTPUT"
            echo "✓ Source code changes detected"
          else
            echo "source_changed=false" >> "$GITHUB_OUTPUT"
            echo "✗ No source code changes detected"
          fi

          echo "Changed files:"
          echo "$CHANGED_FILES"

      - name: Compute version suffix
        run: echo "VersionSuffix=$(date +'%Y%m%d')-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore RazorConsole.slnx

      - name: Build
        run: dotnet build RazorConsole.slnx --configuration Release --no-restore -p:VersionSuffix=$VersionSuffix

      - name: Test
        run: dotnet test --configuration Release --no-build -- --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml
        
      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          files: ${{ github.workspace }}/**/coverage.cobertura.xml
          fail_ci_if_error: false
          flags: nightly
          name: codecov-nightly

      - name: Pack libraries
        run: |
          dotnet pack RazorConsole.slnx \
            --configuration Release \
            --no-build \
            --output artifacts/packages \
            -p:VersionSuffix=$VersionSuffix

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: nightly-packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: warn
          retention-days: 7

      - name: Push packages to NuGet.org
        if: steps.check-changes.outputs.source_changed == 'true'
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          for package in artifacts/packages/*.nupkg; do
            dotnet nuget push "$package" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done
