name: Activate legacy website redirects

on:
  workflow_dispatch:
    inputs:
      confirm_root_site_live:
        description: razorconsole.com and representative routes have been verified live
        required: true
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build redirect-only project site
    if: inputs.confirm_root_site_live && vars.WEBSITE_DEPLOYMENT_MODE == 'redirects'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build and verify website
        uses: ./.github/actions/build-website
        with:
          site-url: https://razorconsole.com

      - name: Verify live custom-domain production
        working-directory: website
        run: npm run check:seo:deployed

      - name: Generate and verify legacy redirects
        working-directory: website
        env:
          VITE_SITE_URL: https://razorconsole.com
        run: npm run gen:legacy-redirects && npm run test:legacy-redirects

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload redirect artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/build/legacy-redirects

  deploy:
    name: Deploy redirect-only project site
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
