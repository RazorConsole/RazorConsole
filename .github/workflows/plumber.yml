name: Plumber

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  plumber:
    name: Scan workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Plumber reads the workflow states and one run log to work out what the job tokens can do.
      actions: read
      # The findings go to code scanning.
      security-events: write
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false

      - name: Scan the workflows
        uses: getplumber/plumber@v0.7.23
        with:
          # Fail under 85 points out of 100, not on any single finding.
          min-points: 85
          # A pull request from a fork gets a read-only token: it skips the code scanning upload and keeps the scan.
          upload-sarif: ${{ github.event.pull_request.head.repo.fork != true }}
