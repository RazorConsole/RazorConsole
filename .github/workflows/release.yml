name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - '*.*.*'
  workflow_dispatch:

jobs:
  package:
    name: Build, test, and pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore RazorConsole.slnx

      - name: Build
        run: dotnet build RazorConsole.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test RazorConsole.slnx --configuration Release --no-build --verbosity normal

      - name: Pack libraries
        run: |
          dotnet pack RazorConsole.slnx \
            --configuration Release \
            --no-build \
            --output artifacts/packages

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: warn
          retention-days: 90

      - name: Push packages to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          for package in artifacts/packages/*.nupkg; do
            dotnet nuget push "$package" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

  gallery-native-aot:
    name: Gallery Native AOT (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Build on the oldest supported glibc runner for wider Linux compatibility.
          - os: ubuntu-22.04
            rid: linux-x64
            artifact: linux-x64
            archive: tar.gz
          - os: ubuntu-22.04-arm
            rid: linux-arm64
            artifact: linux-arm64
            archive: tar.gz
          - os: windows-2025
            rid: win-x64
            artifact: windows-x64
            archive: zip
          - os: windows-11-vs2026-arm
            rid: win-arm64
            artifact: windows-arm64
            archive: zip
          - os: macos-15-intel
            rid: osx-x64
            artifact: macos-x64
            archive: tar.gz
          - os: macos-15
            rid: osx-arm64
            artifact: macos-arm64
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: |
            10.0.x

      - name: Install Linux Native AOT prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Compute artifact version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="dev-${GITHUB_SHA:0:7}"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Publish Gallery Native AOT
        shell: bash
        run: |
          dotnet publish src/RazorConsole.Gallery/RazorConsole.Gallery.csproj \
            --configuration Release \
            --framework net10.0 \
            --runtime "${{ matrix.rid }}" \
            -p:PublishAot=true \
            -p:StripSymbols=true \
            --output artifacts/gallery/publish

      - name: Package Gallery (Linux and macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          archive_name="razorconsole-gallery-${{ steps.version.outputs.value }}-${{ matrix.artifact }}"
          stage="artifacts/gallery/$archive_name"
          mkdir -p "$stage/Fonts"
          cp artifacts/gallery/publish/RazorConsole.Gallery "$stage/razorconsole-gallery"
          cp "artifacts/gallery/publish/Fonts/Slant Relief.flf" "$stage/Fonts/Slant Relief.flf"
          chmod +x "$stage/razorconsole-gallery"
          tar -C artifacts/gallery -czf "artifacts/gallery/$archive_name.tar.gz" "$archive_name"

      - name: Package Gallery (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archiveName = "razorconsole-gallery-${{ steps.version.outputs.value }}-${{ matrix.artifact }}"
          $stage = "artifacts/gallery/$archiveName"
          New-Item -ItemType Directory -Force "$stage/Fonts" | Out-Null
          Copy-Item artifacts/gallery/publish/RazorConsole.Gallery.exe "$stage/razorconsole-gallery.exe"
          Copy-Item "artifacts/gallery/publish/Fonts/Slant Relief.flf" "$stage/Fonts/Slant Relief.flf"
          Compress-Archive -Path $stage -DestinationPath "artifacts/gallery/$archiveName.zip"

      - name: Verify native executable architecture
        shell: bash
        run: |
          executable="artifacts/gallery/publish/RazorConsole.Gallery"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            executable="$executable.exe"
          fi
          description="$(file "$executable")"
          echo "$description"
          if [[ "${{ matrix.rid }}" == *-arm64 ]]; then
            echo "$description" | grep -Eiq 'arm64|aarch64'
          else
            echo "$description" | grep -Eiq 'x86-64|x86_64|x64'
          fi

      - name: Upload Gallery archive
        uses: actions/upload-artifact@v4
        with:
          name: gallery-native-${{ matrix.artifact }}
          path: artifacts/gallery/*.${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 90

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - package
      - gallery-native-aot
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: gallery-native-*
          path: artifacts/release
          merge-multiple: true

      - name: Download NuGet packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/release

      - name: Generate Gallery checksums
        working-directory: artifacts/release
        run: sha256sum razorconsole-gallery-* > checksums-sha256.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/release/*.nupkg
            artifacts/release/*.snupkg
            artifacts/release/*.tar.gz
            artifacts/release/*.zip
            artifacts/release/checksums-sha256.txt
          draft: true
          prerelease: false

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
