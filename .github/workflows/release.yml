name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - '*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build, test, and pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore RazorConsole.slnx

      - name: Build
        run: dotnet build RazorConsole.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test RazorConsole.slnx --configuration Release --no-build --verbosity normal

      - name: Pack libraries
        run: |
          dotnet pack RazorConsole.slnx \
            --configuration Release \
            --no-build \
            --output artifacts/packages

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: warn
          retention-days: 90

      - name: Push packages to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          for package in artifacts/packages/*.nupkg; do
            dotnet nuget push "$package" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

  native-aot:
    name: Native AOT apps (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Build on the oldest supported glibc runner for wider Linux compatibility.
          - os: ubuntu-22.04
            rid: linux-x64
            artifact: linux-x64
            archive: tar.gz
          - os: ubuntu-22.04-arm
            rid: linux-arm64
            artifact: linux-arm64
            archive: tar.gz
          - os: windows-2025
            rid: win-x64
            artifact: windows-x64
            archive: zip
          - os: windows-11-vs2026-arm
            rid: win-arm64
            artifact: windows-arm64
            archive: zip
          - os: macos-15-intel
            rid: osx-x64
            artifact: macos-x64
            archive: tar.gz
          - os: macos-15
            rid: osx-arm64
            artifact: macos-arm64
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: |
            10.0.x

      - name: Install Linux Native AOT prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Compute artifact version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="dev-${GITHUB_SHA:0:7}"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Publish and package Native AOT apps
        shell: pwsh
        run: |
          ./scripts/publish-native-aot-apps.ps1 `
            -RuntimeIdentifier "${{ matrix.rid }}" `
            -Version "${{ steps.version.outputs.value }}" `
            -ManifestPath artifacts/native-aot-apps.json

      - name: Verify native executable architectures
        shell: bash
        run: |
          while IFS=$'\t' read -r command assembly; do
            assembly="${assembly%$'\r'}"
            executable="artifacts/native-aot/$command/publish/$assembly"
            if [[ "$RUNNER_OS" == "Windows" ]]; then
              executable="$executable.exe"
            fi
            description="$(file "$executable")"
            echo "$description"
            if [[ "${{ matrix.rid }}" == *-arm64 ]]; then
              echo "$description" | grep -Eiq 'arm64|aarch64'
            else
              echo "$description" | grep -Eiq 'x86-64|x86_64|x64'
            fi
          done < <(jq -r '.apps[] | [.commandName, .assemblyName] | @tsv' artifacts/native-aot-apps.json)

      - name: Upload Native AOT archives
        uses: actions/upload-artifact@v4
        with:
          name: native-aot-${{ matrix.artifact }}
          path: artifacts/native-aot/*.${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 90

  website:
    name: Build website production
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build and verify website
        uses: ./.github/actions/build-website
        with:
          site-url: https://razorconsole.com

      - name: Upload verified website
        uses: actions/upload-artifact@v4
        with:
          name: website-production-${{ github.sha }}
          path: website/build/client
          retention-days: 90

  deploy-website-production:
    name: Deploy website production
    if: startsWith(github.ref, 'refs/tags/')
    needs: [website, package, native-aot]
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/deploy-cloudflare-production.yml
    with:
      artifact-name: website-production-${{ github.sha }}
      source-commit: ${{ github.sha }}
    secrets: inherit

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - package
      - native-aot
      - website
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: native-aot-*
          path: artifacts/release
          merge-multiple: true

      - name: Download NuGet packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/release

      - name: Generate Native AOT checksums
        working-directory: artifacts/release
        run: sha256sum ./*.tar.gz ./*.zip > checksums-sha256.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/release/*.nupkg
            artifacts/release/*.snupkg
            artifacts/release/*.tar.gz
            artifacts/release/*.zip
            artifacts/release/checksums-sha256.txt
          draft: true
          prerelease: false

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
