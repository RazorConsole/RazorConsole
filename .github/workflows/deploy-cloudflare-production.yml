name: Deploy Cloudflare production

on:
  workflow_call:
    inputs:
      artifact-name:
        description: Website artifact produced by the calling workflow
        required: true
        type: string
      source-commit:
        description: Source commit represented by the artifact
        required: true
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-worker-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Worker
    runs-on: ubuntu-latest
    environment:
      name: cloudflare
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - name: Check out Worker configuration
        uses: actions/checkout@v4

      - name: Download verified website
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: website/build/client

      - name: Record source commit
        run: echo "Deploying source commit ${{ inputs.source-commit }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy Cloudflare Worker production
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.136.3"
          command: deploy --config website/wrangler.jsonc
          gitHubToken: ${{ github.token }}

      - name: Record production deployment
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          {
            echo "## Cloudflare Worker production"
            echo ""
            echo "- Source commit: \`${{ inputs.source-commit }}\`"
            echo "- Deployment: $DEPLOYMENT_URL"
          } >> "$GITHUB_STEP_SUMMARY"
